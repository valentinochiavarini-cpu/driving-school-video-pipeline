<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--highlight:47 100% 58%;--highlight-foreground:217 92% 12%;--success:155 48% 34%;--brand-ink:217 92% 12%;--background:210 25% 98%;--foreground:217 92% 12%;--card:0 0% 100%;--primary:211 68% 38%;--muted:214 24% 92%;--muted-foreground:215 22% 38%;--destructive:0 70% 46%;--border:214 24% 83%;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Inter Variable',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground))}
/* 1080px wide phone frame = 360 CSS px * 3. Render at 3x via zoom. */
#app{width:360px;height:640px;zoom:3;display:flex;flex-direction:column;background:hsl(var(--background))}
.studio-header{padding:.25rem 1rem .5rem;border-bottom:1px solid hsl(var(--border))}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem;height:3.2rem}
.hdr .l{display:flex;align-items:center;gap:.5rem}
.hdr .back{width:2.25rem;height:2.25rem;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.hdr .title{font-size:1rem;font-weight:600}
.progress{height:4px;background:hsl(var(--muted));border-radius:2px;overflow:hidden}
.progress>i{display:block;height:100%;background:hsl(var(--primary))}
.studio-main{flex:1;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.85rem}
.studio-question{font-size:1.35rem;line-height:1.3;font-weight:600}
.studio-image{display:flex;align-items:center;justify-content:center;height:8rem;padding:.25rem;background:hsl(var(--muted)/.5);border-radius:.5rem}
.studio-image img{width:100%;height:100%;object-fit:contain}
.studio-answers{display:grid;gap:.6rem}
.studio-answer{display:flex;align-items:center;gap:.7rem;min-height:3.25rem;padding:.75rem .85rem;border:2px solid hsl(var(--border));border-radius:.6rem;background:hsl(var(--card));font-size:1.05rem;line-height:1.3;text-align:left}
.studio-letter{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:2rem;height:2rem;border-radius:9999px;background:hsl(var(--muted));font-weight:700}
.studio-answer .t{flex:1;min-width:0}
.studio-answer .ic{width:1.4rem;height:1.4rem;flex-shrink:0}
.reveal .studio-answer{color:hsl(var(--muted-foreground))}
.reveal .studio-answer.correct{color:hsl(var(--foreground));border-color:hsl(var(--success));background:hsl(var(--success)/.1);box-shadow:0 0 0 3px hsl(var(--success)/.5),0 0 24px hsl(var(--success)/.45)}
.studio-explanation{padding:.75rem .85rem;font-size:.98rem;line-height:1.4;color:hsl(var(--muted-foreground));border:1px solid hsl(var(--border));border-radius:.5rem}
.studio-timer{position:relative;display:inline-flex;align-items:center;justify-content:center;width:3.4rem;height:3.4rem}
.studio-ring{position:absolute;inset:0;width:100%;height:100%}
.studio-ring-bg{fill:none;stroke:hsl(var(--muted));stroke-width:5}
.studio-ring-fg{fill:none;stroke:hsl(var(--primary));stroke-width:5;stroke-linecap:round}
.studio-ring-num{font-weight:800;font-size:1.2rem;line-height:1;font-variant-numeric:tabular-nums}
.urgent .studio-ring-fg{stroke:hsl(var(--destructive))}.urgent .studio-ring-num{color:hsl(var(--destructive))}
.rv .studio-ring-fg{stroke:hsl(var(--success))}.rv .studio-ring-num{color:hsl(var(--success))}
.studio-footer{padding:.5rem 1rem .75rem;border-top:1px solid hsl(var(--border))}
.btn{display:block;width:100%;padding:.65rem;border-radius:.4rem;background:hsl(var(--primary));color:#fff;font-weight:600;text-align:center;font-size:.9rem}
.btn.off{opacity:.5}
.dim{position:absolute;inset:0;background:hsl(var(--background)/.55);z-index:40}
/* cards */
.card{position:relative;width:360px;height:640px;zoom:3;background:hsl(var(--brand-ink));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden}
.card .logo{position:absolute;top:1.4rem;left:0;right:0;font-weight:800;letter-spacing:.08em;font-size:.8rem;opacity:.9}
.card .road{position:absolute;bottom:2.2rem;left:0;right:0;border-top:3px dashed hsl(var(--highlight)/.5)}
.card h1{font-size:2.1rem;line-height:1.1;font-weight:900;text-transform:uppercase}
.card h1 em{font-style:normal;color:hsl(var(--highlight))}
.card h2{margin-top:1.1rem;font-size:1.1rem;font-weight:500;opacity:.85}
.card .pill{margin-top:1.6rem;background:hsl(var(--highlight));color:hsl(var(--highlight-foreground));font-weight:800;padding:.6rem 1.2rem;border-radius:.5rem;font-size:1.05rem}
.card .scores{display:flex;gap:.4rem;margin-top:1.2rem}
.card .scores span{width:2.6rem;padding:.5rem 0;border:2px solid hsl(var(--highlight));border-radius:.4rem;font-weight:700;font-size:.85rem}
</style></head>
<body><div id="root"></div>
<script>
const R=26,C=2*Math.PI*R;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
window.renderQuestion=function(q,idx,total,seconds,totalSec,phase,dim,lang){
  const es=lang==='es';
  const reveal=phase==='reveal';
  const off=totalSec>0?C*(1-seconds/totalSec):C;
  const urgent=!reveal&&seconds>0&&seconds<=3;
  const ans=['A','B','C','D'].map(k=>{
    const ok=q.correct_answer===k;
    return `<div class="studio-answer ${reveal&&ok?'correct':''}"><span class="studio-letter">${k}</span><span class="t">${esc(q.answers[k])}</span>${reveal&&ok?'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="hsl(155 48% 34%)" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 5-5"/></svg>':''}</div>`}).join('');
  document.getElementById('root').innerHTML=`<div id="app" class="${reveal?'reveal':''}">
   ${dim?'<div class="dim"></div>':''}
   <div class="studio-header"><div class="hdr"><div class="l"><span class="back">&#8592;</span><span class="title">${es?'Pregunta':'Question'} ${idx+1} ${es?'de':'of'} ${total}</span><span class="back">&#10074;&#10074;</span></div>
   <span class="studio-timer ${urgent?'urgent':''} ${reveal?'rv':''}"><svg class="studio-ring" viewBox="0 0 64 64"><circle class="studio-ring-bg" cx="32" cy="32" r="${R}"/><circle class="studio-ring-fg" cx="32" cy="32" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/></svg><span class="studio-ring-num">${seconds}</span></span></div>
   <div class="progress"><i style="width:${(idx+1)/total*100}%"></i></div></div>
   <div class="studio-main"><p class="studio-question">${esc(q.question_text)}</p>
   ${q.image_url?`<div class="studio-image"><img src="${q.image_url}"></div>`:''}
   <div class="studio-answers">${ans}</div>
   ${reveal&&q.explanation?`<p class="studio-explanation">${esc(q.explanation)}</p>`:''}</div>
   <div class="studio-footer"><div class="btn ${reveal?'':'off'}">${es?(idx+1===total?'Terminar':'Siguiente pregunta'):(idx+1===total?'Finish set':'Next question')}</div></div></div>`;
};
window.renderCard=function(kind,a,b){
  const logo='<div class="logo">THE DRIVING SCHOOL</div><div class="road"></div>';
  let inner='';
  if(kind==='hook1') inner=`<h1>${a}</h1>${b?`<h2>${b}</h2>`:''}`;
  if(kind==='hook2') inner=`<h1>${a}</h1><div class="pill">${b}</div>`;
  if(kind==='outro'){const n=a||5,es=b==='es';const boxes=Array.from({length:Math.min(n,7)},(_,i)=>`<span>${i+1}/${n}</span>`).join('');
    inner=`<h1>${es?'DEJA TU <em>PUNTAJE</em>':'DROP YOUR <em>SCORE</em>'}</h1><h2>${es?'en los comentarios':'in the comments'}</h2><div class="scores">${boxes}</div><div class="pill">${es?'LINK EN LA BIO':'LINK IN BIO'} &rarr;</div>`;}
  document.getElementById('root').innerHTML=`<div class="card">${logo}${inner}</div>`;
};
</script></body></html>
